<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon Suivi Muscu — Alexandre</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#101112;--panel:#191a1b;--panel2:#222426;--line:#35383b;--muted:#969b9f;--text:#f5f3ef;--orange:#b71c1c;--orange2:#b71c1c;--danger:#f07b68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.04;background-image:linear-gradient(transparent 95%,#fff 96%),linear-gradient(90deg,transparent 95%,#fff 96%);background-size:25px 25px}.shell{max-width:1180px;margin:auto;padding:34px 24px 72px}.mast{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:25px}.eyebrow{color:var(--orange);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.brand{font:800 clamp(42px,7vw,78px)/.86 'Barlow Condensed';letter-spacing:-.04em;text-transform:uppercase;margin:10px 0 0}.brand em{color:var(--orange);font-style:normal}.tag{text-align:right;color:var(--muted);font-size:11px;line-height:1.6}.tabs{display:flex;gap:8px;margin-bottom:24px}.tab,button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 13px;font:500 11px 'DM Mono';cursor:pointer;transition:.18s}.tab{background:transparent}.tab:hover,.tab.active,button:hover{border-color:var(--orange)}.tab.active{background:rgba(183,28,28,.12);color:#fff}.tab-pane{display:none}.tab-pane.active{display:block}.toolbar,.prog-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:21px}.week-nav{display:flex;align-items:center;gap:9px;margin-right:auto}.week-nav button{font-size:22px;padding:5px 13px}.week-label{font:700 30px 'Barlow Condensed';text-transform:uppercase}.datebox,.field{color:var(--muted);font-size:10px;text-transform:uppercase}.datebox{display:flex;gap:8px;align-items:center}input,select{background:#141516;color:var(--text);border:1px solid var(--line);padding:10px 11px;font:inherit;outline:none}input:focus,select:focus{border-color:var(--orange)}.primary{background:var(--orange);border-color:var(--orange)}.danger{color:var(--danger)}.session{background:rgba(25,26,27,.94);border:1px solid var(--line);margin:14px 0;box-shadow:9px 9px #0a0b0b}.session-head{display:flex;gap:10px;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(255,91,38,.13),transparent)}.session-title{flex:1;font:700 24px 'Barlow Condensed';text-transform:uppercase}.exercise{padding:17px;border-bottom:1px dashed #3a3c3e}.exercise:last-child{border-bottom:0}.ex-head{display:flex;gap:9px;align-items:center}.ex-name{font:600 19px 'Barlow Condensed';text-transform:uppercase;flex:1}.badge{font-size:9px;padding:5px 7px;border:1px solid var(--orange);color:var(--orange);letter-spacing:.08em}.badge.hors{border-color:#888;color:#bbb}.tiny,.icon-btn{padding:7px 9px}.mode-row,.rpe-fields{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:10px}.rpe-fields input{width:105px}.target{color:var(--orange2)}.sets{overflow-x:auto;margin-top:12px}.set-row{display:grid;grid-template-columns:30px repeat(3,minmax(90px,1fr)) 32px;gap:7px;align-items:center;margin:7px 0;min-width:410px}.set-row span{color:var(--muted);font-size:10px}.set-row .set-target{display:block;color:var(--orange2);font-size:8px;line-height:1.15;margin-top:3px;white-space:nowrap}.set-head{font-size:9px;text-transform:uppercase;letter-spacing:.08em}.set-row input{width:100%;padding:8px}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);font-size:12px}.section-intro{color:var(--muted);font-size:11px;line-height:1.7}.field{display:grid;gap:7px}.field select{min-width:290px}.chart-wrap{height:370px;background:var(--panel);border:1px solid var(--line);padding:16px}.summary{margin:14px 0;color:var(--orange2);font:600 17px 'Barlow Condensed';text-transform:uppercase}.hide{display:none!important}@media(max-width:700px){.shell{padding:22px 14px}.mast{display:block}.tag{text-align:left;margin-top:15px}.week-nav{width:100%}.datebox{width:100%}.chart-wrap{height:300px}.field select{min-width:0;width:100%}}
</style></head>
<body><main class="shell">
<header class="mast"><div><div class="eyebrow">Journal d'entraînement / 01</div><h1 class="brand">Mon Suivi <em>Muscu</em></h1></div><div class="tag">Chaque série compte.<br>Construisez la force, semaine après semaine.</div></header>
<nav class="tabs"><button class="tab active" data-tab="programme">📋 Programme</button><button class="tab" data-tab="progression">📈 Progression</button></nav>
<section id="programme" class="tab-pane active"><div class="toolbar"><div class="week-nav"><button id="prevWeek">‹</button><div id="weekLabel" class="week-label">Semaine 1</div><button id="nextWeek">›</button></div><label class="datebox">Date de la semaine <input id="weekDate" type="date"></label><button id="newWeek">＋ Nouvelle semaine</button><button id="preset" class="primary">⭐ Preset Alexandre</button><button id="copy">📋 Copier depuis…</button><button id="export">💾 Exporter</button><button id="importBtn">📂 Importer</button><input id="importFile" type="file" accept="application/json" class="hide"><button id="reset" class="danger">↺ Reset</button></div><div id="sessions"></div><button id="addSession" class="primary">＋ séance</button></section>
<section id="progression" class="tab-pane"><p class="section-intro">Charge maximale par semaine. En mode RPE, la courbe utilise la cible calculée de chaque série.</p><div class="prog-controls"><label class="field">Exercice<select id="exerciseSelect"></select></label><label class="field">À partir du <input id="startDate" type="date"></label></div><div id="progEmpty" class="empty">Aucune donnée de progression disponible.</div><div id="summary" class="summary hide"></div><div class="chart-wrap"><canvas id="progressChart"></canvas></div></section>
</main>
<script>
(()=>{'use strict';
const KEY='muscuData';const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10);let data=load(),wi=0,chart=null;
function blankWeek(){return{date:today(),sessions:[]}}function force(name){return{name,type:'force',mode:'classique',arm:'',rpe:'8',sets:[{kg:'',reps:'',rir:''}]}}function hors(name){return{name,type:'hors',sets:[{kg:'',reps:'',rir:''}]}}
const PRESET=[['Séance 1 (Squat, Pec Épaule)',['Squat','Bench 2CT (pause)','Développé militaire debout','Bench Smith','Élévations latérales']],['Séance 2 (Deadlift, Dos, Triceps)',['Deadlift','Traction lestée','T-bar','Tirage poulie','Dips machine','Extension triceps']],['Séance 3 (Haltéro, Jambes)',['Arraché','Épaulé','Hack Squat','RDL','Hip Thrust']],['Séance 4 (Bench, Biceps, Épaule)',['Bench','Curl incliné','Développé militaire','Curl marteau','Élévations latérales','Arrière d\'épaule poulie']],['Séance 5 (Dips, Accessoire, Dos)',['Dips','Squat 2CT (pause)','Deadlift Deadstop','T-bar','Tirage unilatéral']]];
function preset(){return PRESET.map(([title,arr])=>({title,exercises:arr.map(force)}))}function norm(d){if(!d||!Array.isArray(d.weeks))return{weeks:[blankWeek()]};d.weeks=d.weeks.map(w=>({date:w.date||'',sessions:Array.isArray(w.sessions)?w.sessions.map(s=>({title:s.title||'Séance',exercises:Array.isArray(s.exercises)?s.exercises:[]})):[]}));return d}function load(){try{return norm(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return{weeks:[blankWeek()]}}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function target(arm,rpe,reps){const a=Number(arm),r=Number(rpe),n=Number(reps);if(!(a>0&&r>0&&n>0))return null;const pct=1-.025*((10-r)+(n-1));return Math.max(0,a*pct)}
function render(){const w=data.weeks[wi]||data.weeks[0];$('#weekLabel').textContent=`Semaine ${wi+1}`;$('#weekDate').value=w.date||'';const root=$('#sessions');root.innerHTML='';if(!w.sessions.length)root.innerHTML='<div class="empty">Aucune séance. Ajoutez-en une ou chargez le Preset Alexandre.</div>';w.sessions.forEach((s,si)=>root.appendChild(sessionEl(s,si)));refreshExercises()}
function sessionEl(s,si){const a=document.createElement('article');a.className='session';const h=document.createElement('div');h.className='session-head';const t=document.createElement('div');t.className='session-title';t.textContent=s.title;t.ondblclick=()=>{const v=prompt('Titre de la séance',s.title);if(v){s.title=v;save();render()}};const add=document.createElement('button');add.className='tiny';add.textContent='＋ exercice';add.onclick=()=>{const n=prompt('Nom de l’exercice');if(!n)return;s.exercises.push(confirm('Exercice de force ? (OK = force, Annuler = hors force)')?force(n):hors(n));save();render()};const del=document.createElement('button');del.className='icon-btn danger';del.textContent='🗑';del.onclick=()=>{if(confirm('Supprimer cette séance ?')){data.weeks[wi].sessions.splice(si,1);save();render()}};h.append(t,add,del);a.append(h);s.exercises.forEach((e,ei)=>a.appendChild(exEl(e,s,ei)));return a}
function exEl(x,s,ei){const a=document.createElement('div');a.className='exercise';const h=document.createElement('div');h.className='ex-head';const n=document.createElement('div');n.className='ex-name';n.textContent=x.name;const b=document.createElement('span');b.className='badge '+(x.type==='hors'?'hors':'');b.textContent=x.type==='hors'?'HORS FORCE':'FORCE';const d=document.createElement('button');d.className='icon-btn danger';d.textContent='🗑';d.onclick=()=>{if(confirm('Supprimer cet exercice ?')){s.exercises.splice(ei,1);save();render()}};h.append(n,b,d);a.append(h);if(x.type==='force'){const m=document.createElement('div');m.className='mode-row';m.innerHTML='<span>Mode de charge</span>';const sel=document.createElement('select');sel.innerHTML='<option value="classique">Classique</option><option value="rpe">RPE</option>';sel.value=x.mode||'classique';sel.onchange=()=>{x.mode=sel.value;save();render()};m.append(sel);a.append(m);if(sel.value==='rpe'){const rf=document.createElement('div');rf.className='rpe-fields';rf.innerHTML=`<label>ARM (1RM est. kg) <input type="number" min="0" step="0.5" value="${x.arm||''}"></label><label>RPE visé <input type="number" min="1" max="10" step="0.5" value="${x.rpe||8}"></label><span class="target">La cible dépend des reps de chaque série</span>`;const ins=rf.querySelectorAll('input');ins[0].oninput=()=>{x.arm=ins[0].value;save();updateTargets(x,rf)};ins[1].oninput=()=>{x.rpe=ins[1].value;save();updateTargets(x,rf)};a.append(rf)}}a.append(sets(x));return a}
function updateTargets(x,rf){const vals=(x.sets||[]).map(q=>target(x.arm,x.rpe,q.reps)).filter(v=>v!=null);rf.querySelector('.target').textContent=vals.length?`Cible : ${vals.map(v=>v.toFixed(1)).join(' / ')} kg`:'Cible : —'}
function sets(x){const box=document.createElement('div');box.className='sets';const r=document.createElement('div');r.className='set-row set-head';r.innerHTML='<span>#</span><span>'+(x.type==='force'&&x.mode==='rpe'?'Cible kg / Charge':'Charge kg')+'</span><span>Reps</span><span>RIR</span><span></span>';box.append(r);(x.sets||[]).forEach((q,i)=>{const row=document.createElement('div');row.className='set-row';const c=x.type==='force'&&x.mode==='rpe'&&target(x.arm,x.rpe,q.reps)!=null?target(x.arm,x.rpe,q.reps).toFixed(1):'';row.innerHTML=`<span>${i+1}</span><span><input type="number" min="0" step="0.5" value="${q.kg??''}" placeholder="${c||'kg'}">${c?`<small class="set-target">Cible : ${c} kg</small>`:''}</span><input type="number" min="0" value="${q.reps??''}"><input type="number" min="0" step="0.5" value="${q.rir??''}"><button class="icon-btn danger">✖</button>`;row.querySelectorAll('input').forEach((inp,j)=>inp.oninput=()=>{q[['kg','reps','rir'][j]]=inp.value;save();if(x.mode==='rpe'){const f=inp.closest('.exercise')?.querySelector('.rpe-fields');if(f)updateTargets(x,f)}});row.querySelector('button').onclick=()=>{x.sets.splice(i,1);save();render()};box.append(row)});const add=document.createElement('button');add.className='tiny';add.textContent='＋ série';add.onclick=()=>{x.sets.push({kg:'',reps:'',rir:''});save();render()};box.append(add);return box}
function names(){return[...new Set(data.weeks.flatMap(w=>w.sessions.flatMap(s=>s.exercises.map(e=>e.name).filter(Boolean))))].sort((a,b)=>a.localeCompare(b,'fr'))}function points(ex,start){const min=start?new Date(start+'T00:00:00').getTime():-Infinity,out=[];data.weeks.forEach((w,i)=>{const tm=w.date?new Date(w.date+'T00:00:00').getTime():NaN;if(Number.isFinite(tm)&&tm<min)return;let max=-Infinity;w.sessions.forEach(s=>s.exercises.filter(e=>e.name===ex).forEach(e=>e.sets.forEach(q=>{const v=e.mode==='rpe'?target(e.arm,e.rpe,q.reps):Number(q.kg);if(v!=null&&Number.isFinite(v))max=Math.max(max,v)})));if(max>-Infinity)out.push({label:w.date||`Semaine ${i+1}`,date:w.date||`Semaine ${i+1}`,value:max})});return out}
function refreshExercises(){const sel=$('#exerciseSelect'),old=sel.value;sel.innerHTML=names().map(n=>`<option>${esc(n)}</option>`).join('');if(names().includes(old))sel.value=old;draw()}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function draw(){const p=points($('#exerciseSelect').value,$('#startDate').value);$('#progEmpty').classList.toggle('hide',p.length>0);$('#summary').classList.toggle('hide',p.length<2);if(p.length>=2){const d=p[p.length-1].value-p[0].value;$('#summary').textContent=`📈 ${d>=0?'+':''}${d.toFixed(1).replace('.0','')} kg depuis le ${p[0].date}`}if(chart)chart.destroy();if(!window.Chart)return;chart=new Chart($('#progressChart'),{type:'line',data:{labels:p.map(x=>x.label),datasets:[{label:'Charge max (kg)',data:p.map(x=>x.value),borderColor:'#ff5b26',backgroundColor:'#ff5b26',pointRadius:5,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{grid:{color:'#333'},ticks:{color:'#aaa'}},y:{grid:{color:'#333'},ticks:{color:'#aaa'},title:{display:true,text:'kg',color:'#aaa'}}},plugins:{legend:{labels:{color:'#ddd'}},tooltip:{callbacks:{label:c=>` ${c.parsed.y.toFixed(1)} kg`}}}}})}
function bind(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.tab-pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='progression')draw()});$('#prevWeek').onclick=()=>{if(wi>0){wi--;render()}};$('#nextWeek').onclick=()=>{if(wi<data.weeks.length-1){wi++;render()}};$('#newWeek').onclick=()=>{data.weeks.push(blankWeek());wi=data.weeks.length-1;save();render()};$('#weekDate').onchange=e=>{data.weeks[wi].date=e.target.value;save();refreshExercises()};$('#preset').onclick=()=>{if(confirm('Remplacer les séances de la semaine actuelle ?')){data.weeks[wi].sessions=preset();save();render()}};$('#addSession').onclick=()=>{const n=prompt('Titre de la séance','Nouvelle séance');if(n){data.weeks[wi].sessions.push({title:n,exercises:[]});save();render()}};$('#copy').onclick=()=>{if(data.weeks.length<2)return alert('Créez une autre semaine avant de copier.');const opts=data.weeks.map((w,i)=>`${i+1}: ${w.date||'sans date'}`).join('\n');const n=prompt('Numéro de la semaine source :\n'+opts,String(wi));const from=Number(n)-1;if(data.weeks[from]&&from!==wi){data.weeks[wi].sessions=JSON.parse(JSON.stringify(data.weeks[from].sessions));save();render()}};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='muscuData.json';a.click()};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=norm(JSON.parse(r.result));wi=0;save();render()}catch(_){alert('JSON invalide.')}};r.readAsText(f)};$('#reset').onclick=()=>{if(confirm('Réinitialiser toutes les semaines et données ?')){data={weeks:[blankWeek()]};wi=0;save();render()}};$('#exerciseSelect').onchange=draw;$('#startDate').onchange=draw}
window.__muscuTest={preset,target,points,names};document.addEventListener('DOMContentLoaded',()=>{bind();render()});
})();
</script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}' crossorigin="anonymous"></script>
</body></html>
